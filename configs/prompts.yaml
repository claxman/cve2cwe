# Prompts for the candidate (the fine-tuned Qwen3.5-4B). Section 7 of
# docs/DESIGN.md: "The candidate's prompt is a short instruction with no
# label list." Reasoning is disabled through the chat template.
#
# The description is cut to configs/systems.yaml max_description_chars
# before being formatted into the user template. The cut is applied by
# src/cve2cwe/prompts.py and is shared by train and inference.

candidate:
  system: "You label CVE records. Given a CVE description, answer with the one CWE id an NVD analyst would assign, for example CWE-79. Answer with the id only."
  user_template: |
    CVE description:
    {description}

    Answer with one CWE id.

# Baseline prompts for every open-weight and frontier LLM (DESIGN section 6,
# systems 4-6, and Step 7 work order section B). The baseline system prompt
# is the header below followed by a blank line and one line per label from
# data/processed/labels.json ("CWE-79: <name>"). The user_template is the
# same as candidate.user_template, used for the final query and for every
# few-shot or retrieval example turn. The exact candidate prompt above must
# not change; see tests/test_prompts.py::test_candidate_prompt_is_golden.
baseline:
  system_header: "You label CVE records. Given a CVE description, answer with the one CWE id an NVD analyst would assign. Choose from the list below. Answer with the id only, for example CWE-79."
