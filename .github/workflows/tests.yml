name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # The README check finds the acceptance commit with git log.
      # A one-commit checkout has no parent, so that search would name the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e .
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: README check
        run: python -m cve2cwe report --check
